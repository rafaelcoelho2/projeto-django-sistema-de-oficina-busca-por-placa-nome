<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina - Home</title>

    {% load static %}

    <style>
        /* ... Seus estilos anteriores mantidos ... */
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-image: url("{% static 'img/operacaoo.png' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            width: 100%;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            background: rgba(0, 0, 0, 0.7); /* Escureci um pouco mais para destacar o neon */
            width: 100%;
            height: 100%;
            padding-top: 80px;
            padding-left: 50px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        h1 {
            margin-bottom: 40px;
            margin-left: 10px;
            text-shadow: 2px 2px 4px #000000;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        a {
            display: block;
            font-size: 18px;
            margin: 10px 0;
            color: #fff;
            text-decoration: none;
            padding: 15px 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            width: 320px;
            border-radius: 5px;
            transition: 0.3s;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            text-transform: uppercase;
        }

        a:hover {
            background: #28a745; /* Verde para combinar com o tema de operação */
            color: white;
            border-color: #28a745;
            transform: translateX(10px);
            box-shadow: 0 0 15px rgba(40, 167, 69, 0.4);
        }

        /* Destaque especial para o Painel de Agentes */
        .btn-agentes {
            border-color: #0f0;
            color: #0f0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Sistema de Inteligência Mecânica</h1>

        <a href="{% url 'cadastrar_tudo' %}">Registrar Cliente / Veículo</a>

        <a href="{% url 'criar_servico' %}">Novo Relatório de Serviço</a>
        <a href="{% url 'buscar' %}">Localizar Veículo (Busca)</a>

        <hr style="width: 320px; border: 0; border-top: 1px solid #333; margin: 20px 0;">

        <a href="{% url 'painel_agentes' %}" class="btn-agentes">Painel de Agentes</a>
        <a href="{% url 'recrutar_agente' %}" style="font-size: 14px; width: 320px; border-style: dashed;">+ Recrutar Novo Mecânico</a>
    </div>
</body>
</html>
