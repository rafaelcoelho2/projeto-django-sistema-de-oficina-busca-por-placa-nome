<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dossiê de Serviço - Oficina</title>
    {% load static %}

    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url("{% static 'img/operacao.png' %}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
        }

        .overlay {
            background-color: rgba(0, 0, 0, 0.85);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dossier-container {
            background: #1a1a1a;
            width: 100%;
            max-width: 600px;
            border: 1px solid #444;
            border-top: 4px solid #28a745;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            padding: 30px;
            position: relative;
        }

        h2 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px dashed #444;
            padding-bottom: 15px;
            margin-top: 0;
            color: #fff;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #aaa;
            font-size: 0.9rem;
        }

        /* AJUSTE TÁTICO: Garante que o SELECT do mecânico fique verde terminal */
        select, textarea, input[type="text"], input[type="number"] {
            width: 100%;
            background: #0f0f0f !important;
            border: 1px solid #333 !important;
            color: #0f0 !important;
            padding: 12px;
            font-family: inherit;
            box-sizing: border-box;
            appearance: none; /* Remove estilo padrão do navegador */
        }

        select:focus, textarea:focus, input:focus {
            outline: none;
            border-color: #28a745 !important;
            background: #000 !important;
        }

        .upload-area {
            border: 2px dashed #444;
            padding: 15px;
            text-align: center;
            background: #111;
            margin-top: 5px;
            transition: 0.3s;
        }

        input[type="file"] { display: none; }

        .custom-file-upload {
            display: inline-block;
            padding: 8px 15px;
            cursor: pointer;
            background: #333;
            color: white;
            border-radius: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .img-preview {
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            display: none;
            border: 1px solid #333;
        }

        .btn-group {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }

        button[type="submit"] {
            flex: 2;
            background: #28a745;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background: #218838;
            box-shadow: 0 0 10px #28a745;
        }

        .btn-cancel {
            flex: 1;
            background: #dc3545;
            color: white;
            text-align: center;
            text-decoration: none;
            padding: 15px;
            font-weight: bold;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="overlay">
    <div class="dossier-container">
        <h2>Relatório de Operação</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div>
                <label>VEÍCULO ALVO:</label>
                {{ form.veiculo }}
            </div>

            <div>
                <label>AGENTE / MECÂNICO RESPONSÁVEL:</label>
                {{ form.mecanico }}
                <small style="color: #666; font-size: 0.7rem;">* Selecione o agente que executou o serviço.</small>
            </div>

            <div>
                <label>DESCRIÇÃO DA OPERAÇÃO:</label>
                {{ form.descricao }}
            </div>

            <div>
                <label>NOTAS DE INTELIGÊNCIA (OBSERVAÇÕES):</label>
                {{ form.observacao_servico }}
            </div>

            <div>
                <label>📸 REGISTRO DO SERVIÇO:</label>
                <div class="upload-area">
                    <label for="id_foto_local_servico" class="custom-file-upload">CÂMERA / ARQUIVO</label>
                    <input type="file" name="foto_local_servico" accept="image/*" id="id_foto_local_servico" onchange="previewImage(this, 'preview-servico')">
                    <br>
                    <img id="preview-servico" class="img-preview" alt="Prévia Serviço">
                </div>
            </div>

            <div class="btn-group">
                <a href="{% url 'home' %}" class="btn-cancel">Abortar</a>
                <button type="submit">GRAVAR RELATÓRIO</button>
            </div>
        </form>
    </div>
</div>

<script>
    function previewImage(input, previewId) {
        var preview = document.getElementById(previewId);
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>

</body>
</html>
