{% extends "oficina/base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0"><i class="bi bi-person-lock"></i> Acesso à Oficina</h4>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Usuário</label>
                            <input type="text" name="username" class="form-control" placeholder="Seu usuário" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Senha</label>
                            <input type="password" name="password" class="form-control" placeholder="******" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="bi bi-box-arrow-in-right"></i> Entrar
                        </button>
                    </form>

                    <div class="mt-4 pt-3 border-top text-center">
                        <p class="text-muted small mb-2">Não tem uma conta de oficina?</p>
                        <a href="{% url 'cadastrar' %}" class="btn btn-outline-success btn-sm w-100">
                            <i class="bi bi-person-plus"></i> Criar Nova Conta
                        </a>
                    </div>
                </div>
                <div class="card-footer text-center bg-light">
                    <small class="text-muted">Sistema de Gestão Automotiva v2.0</small>
                </div>
            </div>
        </div>
    </div>
</div>  
{% endblock %}
