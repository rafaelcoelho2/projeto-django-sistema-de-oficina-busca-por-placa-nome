{% extends "oficina/base.html" %}
{% load static %}

{% block content %}
<div class="auth-page-container">
    <div class="auth-bg-overlay"></div>

    <div class="container">
        <div class="row justify-content-center align-items-center" style="min-height: 90vh;">
            <div class="col-md-4">
                
                <div class="card shadow-lg border-0 bg-white-90">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="mb-0"><i class="bi bi-person-lock"></i> Acesso à Oficina</h4>
                    </div>
                    
                    <div class="card-body p-4">
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Usuário</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                    <input type="text" name="username" class="form-control" placeholder="Seu usuário" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Senha</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                    <input type="password" name="password" class="form-control" placeholder="******" required>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm">
                                <i class="bi bi-box-arrow-in-right"></i> Entrar
                            </button>
                        </form>

                        <div class="mt-4 pt-3 border-top text-center">
                            <p class="text-muted small mb-2">Novo por aqui?</p>
                            <a href="{% url 'cadastrar' %}" class="btn btn-outline-success btn-sm w-100">
                                <i class="bi bi-person-plus"></i> Criar Conta de Mecânico
                            </a>
                        </div>
                    </div>
                    
                    <div class="card-footer text-center bg-transparent border-0 pb-3">
                        <small class="text-muted fw-bold">Sistema de Gestão Automotiva v2.0</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* 1. Remove limites e preenche a tela toda */
    .auth-page-container {
        position: relative;
        width: 100%;
        min-height: 100vh;
        margin-top: -24px; /* Compensa a margem da base.html se necessário */
    }

    .auth-bg-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                    url("{% static 'img/login2.png' %}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: -1; /* Fica atrás de tudo */
    }

    /* 2. Card com efeito de vidro (Glassmorphism) */
    .bg-white-90 {
        background-color: rgba(255, 255, 255, 0.90) !important;
        backdrop-filter: blur(10px); 
        border-radius: 15px;
    }

    /* 3. Ajuste para esconder scroll desnecessário */
    body {
        overflow-x: hidden;
    }
</style>
{% endblock %}
