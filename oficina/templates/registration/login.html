{% extends "oficina/base.html" %}

{% block content %}
<div class="auth-wrapper d-flex align-items-center justify-content-center">
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                
                <div class="card shadow-lg border-0 bg-white-90">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="mb-0"><i class="bi bi-person-lock"></i> Acesso à Oficina</h4>
                    </div>
                    
                    <div class="card-body p-4">
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Usuário</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                    <input type="text" name="username" class="form-control" placeholder="Seu usuário" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Senha</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                    <input type="password" name="password" class="form-control" placeholder="******" required>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm">
                                <i class="bi bi-box-arrow-in-right"></i> Entrar
                            </button>
                        </form>

                        <div class="mt-4 pt-3 border-top text-center">
                            <p class="text-muted small mb-2">Novo por aqui?</p>
                            <a href="{% url 'cadastrar' %}" class="btn btn-outline-success btn-sm w-100">
                                <i class="bi bi-person-plus"></i> Criar Conta de Mecânico
                            </a>
                        </div>
                    </div>
                    
                    <div class="card-footer text-center bg-transparent border-0 pb-3">
                        <small class="text-muted">Sistema de Gestão Automotiva v2.0</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</div>

<style>
    /* CSS específico para esta página para garantir o fundo */
    .auth-wrapper {
        min-height: 85vh; /* Ajustado para não brigar com a navbar */
        background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                    url('/static/img/login2.png'); /* Verifique se o nome da imagem está correto */
        background-size: cover;
        background-position: center;
        border-radius: 15px;
        margin-top: 20px;
    }

    .bg-white-90 {
        background-color: rgba(255, 255, 255, 0.92) !important;
        backdrop-filter: blur(5px); /* Efeito de vidro embaçado moderno */
    }
</style>
{% endblock %}
