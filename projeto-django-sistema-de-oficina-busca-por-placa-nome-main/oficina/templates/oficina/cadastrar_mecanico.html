<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recrutamento de Agentes - Oficina</title>
    {% load static %}
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url("{% static 'img/operacao.png' %}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #0f0;
            font-family: 'Courier New', monospace;
        }

        .overlay {
            background-color: rgba(0, 0, 0, 0.9);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .recruit-container {
            background: #111;
            width: 100%;
            max-width: 450px;
            border: 1px solid #0f0;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            padding: 30px;
            position: relative;
        }

        h2 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 1px solid #0f0;
            padding-bottom: 15px;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.8rem;
            color: #888;
        }

        input[type="text"] {
            width: 100%;
            background: #000;
            border: 1px solid #333;
            color: #0f0;
            padding: 12px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            text-transform: uppercase;
        }

        input[type="text"]:focus {
            border-color: #0f0;
        }

        .btn-confirm {
            width: 100%;
            background: #0f0;
            color: #000;
            border: none;
            padding: 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
        }

        .btn-confirm:hover {
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
            font-size: 0.8rem;
        }

        .back-link:hover { color: #0f0; }
    </style>
</head>
<body>

<div class="overlay">
    <div class="recruit-container">
        <h2>Recrutamento de Agente</h2>
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>NOME DO NOVO MECÂNICO (AGENTE):</label>
                <input type="text" name="nome" placeholder="EX: SARGENTO JOÃO" required autofocus>
            </div>

            <button type="submit" class="btn-confirm">Confirmar Recrutamento</button>
        </form>

        <a href="{% url 'painel_agentes' %}" class="back-link">< VOLTAR AO PAINEL</a>
    </div>
</div>

</body>
</html>
